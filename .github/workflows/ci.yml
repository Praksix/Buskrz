name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '21'

jobs:
  # Job pour le frontend (Client React/Next.js)
  frontend-tests:
    name: 🎨 Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client/buskrz-front
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: 📥 Install dependencies
        run: npm ci
      
      - name: 🔍 Lint code
        run: npm run lint
      
      - name: 🧪 Run tests
        run: npm run test:run
      
      - name: 📊 Generate coverage report
        run: npm run test:coverage
      
      - name: 🏗️ Build application
        run: npm run build
      
      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./client/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # Job pour le backend (API Node.js/Spring Boot)
  backend-tests:
    name: ⚙️ Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: 📦 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      
      
      - name: ⏳ Wait for MongoDB
        run: |
          echo "Waiting for MongoDB to be ready..."
          sleep 10
          echo "Testing MongoDB connection..."
          mongosh --eval "db.adminCommand('ping')" || echo "MongoDB not ready yet"
        if: always()
      
      - name: 🧪 Run tests
        run: mvn test -Dtest=**/*Test
        env:
          MONGODB_URI: mongodb://localhost:27017/buskrz_test
          MONGODB_DATABASE: buskrz_test
      
      - name: 🏗️ Build application
        run: mvn clean package -DskipTests
      
      - name: 🔍 SonarLint Analysis
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ] && [ -n "${{ secrets.SONAR_ORGANIZATION }}" ]; then
            mvn sonar:sonar \
              -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
              -Dsonar.projectKey=buskrz-api \
              -Dsonar.projectName="Buskrz API"
          else
            echo "⚠️ SonarLint analysis skipped - missing SONAR_TOKEN or SONAR_ORGANIZATION secrets"
            echo "To enable SonarLint analysis, add these secrets to your repository:"
            echo "- SONAR_TOKEN: Your SonarCloud token"
            echo "- SONAR_ORGANIZATION: Your SonarCloud organization key"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io