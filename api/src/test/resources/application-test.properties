# Configuration de test pour MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/buskrz_test
spring.data.mongodb.database=buskrz_test

# Désactiver l'authentification pour les tests
spring.data.mongodb.authentication-database=

# Configuration de test
spring.test.database.replace=none
spring.jpa.hibernate.ddl-auto=none

# 🛑 Désactiver complètement MongoDB pour les tests unitaires
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# 🔑 Faux JWT Secret pour les tests (pour que l'injection ne plante pas)
JWT_SECRET_KEY=ceci_est_une_fausse_cle_secrete_jwt_pour_les_tests_unitaires_super_longue_12345
app.jwt.secret=${JWT_SECRET_KEY}
